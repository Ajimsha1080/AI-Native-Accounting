name: Deploy to Microsoft Azure (UAE North)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'infra/azure/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_REGION: 'uaenorth'
  RESOURCE_GROUP: 'rg-ledger-ae-prod'
  PREFIX: 'ledgeraeprod'

jobs:
  build-and-deploy:
    name: Build & Deploy to Azure Container Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        if: env.AZURE_CLIENT_ID != ''
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Container Registry Login
        if: env.AZURE_CLIENT_ID != ''
        run: |
          az acr login --name cr${{ env.PREFIX }}

      - name: Build and Push Backend Image
        if: env.AZURE_CLIENT_ID != ''
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            cr${{ env.PREFIX }}.azurecr.io/ledger-ae-backend:latest
            cr${{ env.PREFIX }}.azurecr.io/ledger-ae-backend:${{ github.sha }}

      - name: Build and Push Web Portal Image
        if: env.AZURE_CLIENT_ID != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/Dockerfile.web
          push: true
          tags: |
            cr${{ env.PREFIX }}.azurecr.io/ledger-ae-web:latest
            cr${{ env.PREFIX }}.azurecr.io/ledger-ae-web:${{ github.sha }}

      - name: Deploy Backend to Azure Container Apps
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ca-${{ env.PREFIX }}-backend
          imageToDeploy: cr${{ env.PREFIX }}.azurecr.io/ledger-ae-backend:${{ github.sha }}

      - name: Deploy Web Portal to Azure Container Apps
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ca-${{ env.PREFIX }}-web
          imageToDeploy: cr${{ env.PREFIX }}.azurecr.io/ledger-ae-web:${{ github.sha }}
