name: LedgerAE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-hygiene:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitLeaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Check for Unwanted Cache Files
        run: |
          echo "Verifying no tsbuildinfo or pyc files are committed..."
          if git ls-files | grep -E '\.(tsbuildinfo|pyc)$'; then
            echo "ERROR: Committed build cache or pyc files detected!"
            exit 1
          fi
          echo "Hygiene check passed."

  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Topological Monorepo Build
        run: npm run build

      - name: Strict Typecheck
        run: npm run typecheck

      - name: Linter Check
        run: npm run lint

      - name: Dependency Vulnerability Audit
        run: npm audit --audit-level=high
        continue-on-error: true

  unit-and-domain-tests:
    name: Unit & Domain Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Packages
        run: npm run build

      - name: Run Monorepo Test Suite
        run: npm test

  playwright-e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build -w @ledger-ae/web

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Suite
        run: npx playwright test -c apps/web/playwright.config.ts
        env:
          CI: true
          PORT: 3005

      - name: Upload Playwright Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  perf-and-dr-benchmarks:
    name: Production DR & 1M Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Monorepo
        run: npm run build

      - name: Execute Automated Disaster Recovery (PITR) Drill
        run: node scripts/dr/run-pitr-drill.mjs

      - name: Execute 1,000,000 Lines Trial Balance Latency Benchmark
        run: node --max-old-space-size=4096 scripts/perf/trial-balance-1m-benchmark.mjs

