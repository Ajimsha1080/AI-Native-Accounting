name: LedgerAE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-hygiene:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitLeaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Check for Unwanted Cache Files
        run: |
          echo "Verifying no tsbuildinfo or pyc files are committed..."
          if git ls-files | grep -E '\.(tsbuildinfo|pyc)$'; then
            echo "ERROR: Committed build cache or pyc files detected!"
            exit 1
          fi
          echo "Hygiene check passed."

  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Topological Monorepo Build
        run: npm run build

      - name: Strict Typecheck
        run: npm run typecheck

      - name: Linter Check
        run: npm run lint

      - name: Dependency Vulnerability Audit
        run: npm audit --audit-level=high
        continue-on-error: true

  unit-and-domain-tests:
    name: Unit & Domain Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ledger_ae_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Postgres non-superuser role
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d ledger_ae_test -c "CREATE ROLE ledger_app WITH LOGIN PASSWORD 'ledger_app_secure_pass'; GRANT ALL PRIVILEGES ON DATABASE ledger_ae_test TO ledger_app; GRANT ALL PRIVILEGES ON SCHEMA public TO ledger_app;"

      - name: Install Dependencies
        run: npm ci

      - name: Build Packages
        run: npm run build

      - name: Run Monorepo Test Suite
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://ledger_app:ledger_app_secure_pass@localhost:5432/ledger_ae_test
          DATABASE_URL: postgresql://ledger_app:ledger_app_secure_pass@localhost:5432/ledger_ae_test

      - name: Run Provider Contract Test Suite
        run: npm run test:contract

      - name: Run AI Bilingual Benchmark Evals & Generate Committed Report
        run: npm run test:eval
        env:
          TEST_DATABASE_URL: postgresql://ledger_app:ledger_app_secure_pass@localhost:5432/ledger_ae_test
          DATABASE_URL: postgresql://ledger_app:ledger_app_secure_pass@localhost:5432/ledger_ae_test

  playwright-e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build -w @ledger-ae/web

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Suite
        run: npx playwright test -c apps/web/playwright.config.ts
        env:
          CI: true
          PORT: 3005

      - name: Upload Playwright Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  perf-and-dr-benchmarks:
    name: Production DR & 1M Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Monorepo
        run: npm run build

      - name: Execute Automated Disaster Recovery (PITR) Drill
        run: node scripts/dr/run-pitr-drill.mjs

      - name: Execute 1,000,000 Lines Trial Balance Latency Benchmark
        run: node --max-old-space-size=4096 scripts/perf/trial-balance-1m-benchmark.mjs

  clean-checkout-verification:
    name: Clean Checkout Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ledger_ae_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Fresh Clean Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Verify withAuth is tracked in git
        run: |
          test -f apps/web/src/lib/auth.ts || (echo "FATAL: apps/web/src/lib/auth.ts is not tracked in git!" && exit 1)

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Postgres non-superuser role
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d ledger_ae_test -c "CREATE ROLE ledger_app WITH LOGIN PASSWORD 'ledger_app_secure_pass'; GRANT ALL PRIVILEGES ON DATABASE ledger_ae_test TO ledger_app; GRANT ALL PRIVILEGES ON SCHEMA public TO ledger_app;"

      - name: Fresh Clean Install
        run: npm ci

      - name: Topological Monorepo Build (First Run)
        run: npm run build

      - name: Monorepo Typecheck
        run: npm run typecheck

      - name: Zero-Float Money & Linter Check
        run: npm run lint

      - name: Monorepo Unit & Integration Test Suite
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://ledger_app:ledger_app_secure_pass@localhost:5432/ledger_ae_test
          DATABASE_URL: postgresql://ledger_app:ledger_app_secure_pass@localhost:5432/ledger_ae_test

      - name: Run Provider Contract Test Suite
        run: npm run test:contract

      - name: Run AI Bilingual Benchmark Evals & Generate Committed Report
        run: npm run test:eval
        env:
          TEST_DATABASE_URL: postgresql://ledger_app:ledger_app_secure_pass@localhost:5432/ledger_ae_test
          DATABASE_URL: postgresql://ledger_app:ledger_app_secure_pass@localhost:5432/ledger_ae_test

      - name: Next.js Production Build
        run: npm run build -w @ledger-ae/web
        env:
          JWT_SECRET: "01234567890123456789012345678901"
          ENCRYPTION_KEY: "01234567890123456789012345678901"


