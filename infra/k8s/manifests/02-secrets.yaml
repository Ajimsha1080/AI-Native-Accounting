apiVersion: v1
kind: Secret
metadata:
  name: ledger-secrets
  namespace: ledger-ae
  labels:
    app.kubernetes.io/name: ledger-ae
    app.kubernetes.io/part-of: ledger-ae
type: Opaque
stringData:
  # PostgreSQL Connection Strings
  # Format for Next.js / PgPool: postgresql://<user>:<password>@<host>:5432/<db>?sslmode=require
  database-url: "postgresql://ledger_admin:LedgerSecure_2026!@ledger-postgres-svc.ledger-ae.svc.cluster.local:5432/ledger_ae"
  # Format for Python FastAPI / AsyncPG: postgresql+asyncpg://<user>:<password>@<host>:5432/<db>
  backend-database-url: "postgresql+asyncpg://ledger_admin:LedgerSecure_2026!@ledger-postgres-svc.ledger-ae.svc.cluster.local:5432/ledger_ae"
  
  # Cryptographic keys - Minimum 32-bytes (256-bit)
  jwt-secret: "01234567890123456789012345678901"
  totp-encryption-key: "01234567890123456789012345678901"
  nextauth-secret: "production_secret_32_chars_long_2026!"
  
  # AI Orchestrator & Claude 3.7 Sonnet Credentials
  anthropic-api-key: "sk-ant-production-placeholder-replace-in-vault"
  
  # S3 Object Storage Credentials (10-Year UAE Tax E-Invoicing Archive)
  s3-access-key: "ledger_minio_admin"
  s3-secret-key: "LedgerMinioSecret_2026!"
  
  # Cache & Distributed Locking
  redis-password: "LedgerRedisAuth_2026!"
  
  # PostgreSQL root / admin passwords
  postgres-user: "ledger_admin"
  postgres-password: "LedgerSecure_2026!"
  postgres-db: "ledger_ae"
