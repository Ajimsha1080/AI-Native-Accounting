apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ledger-ingress
  namespace: ledger-ae
  labels:
    app.kubernetes.io/name: ledger-ae
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  tls:
    - hosts:
        - app.ledgeraegroup.ae
        - api.ledgeraegroup.ae
      secretName: ledger-tls-cert
  rules:
    - host: app.ledgeraegroup.ae
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ledger-web-svc
                port:
                  number: 80
    - host: api.ledgeraegroup.ae
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ledger-backend-svc
                port:
                  number: 8000
