# ==============================================================================
# LedgerAE Production Kubernetes Manifest (Complete Single-File Distribution)
# Jurisdiction: United Arab Emirates (Federal Decree-Law No. 8 of 2017 & No. 47 of 2022)
# Deploy: kubectl apply -f infra/k8s/ledger-ae-prod.yaml
# ==============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: ledger-ae
  labels:
    name: ledger-ae
    app.kubernetes.io/part-of: ledger-ae
    environment: production
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-config
  namespace: ledger-ae
  labels:
    app.kubernetes.io/part-of: ledger-ae
data:
  NODE_ENV: "production"
  ENVIRONMENT: "production"
  PORT: "3000"
  BACKEND_PORT: "8000"
  BACKEND_API_URL: "http://ledger-backend-svc.ledger-ae.svc.cluster.local:8000"
  NEXT_PUBLIC_APP_URL: "https://app.ledgeraegroup.ae"
  NEXT_PUBLIC_DEFAULT_LOCALE: "en"
  DEFAULT_LOCALE: "en"
  DEFAULT_TIMEZONE: "Asia/Dubai"
  JURISDICTION: "AE"
  CURRENCY_CODE: "AED"
  CURRENCY_EXPONENT: "2"
  NEXT_TELEMETRY_DISABLED: "1"
  REDIS_HOST: "ledger-redis-svc.ledger-ae.svc.cluster.local"
  REDIS_PORT: "6379"
  TEMPORAL_ADDRESS: "temporal-frontend.ledger-ae.svc.cluster.local:7233"
  S3_ENDPOINT: "http://ledger-minio-svc.ledger-ae.svc.cluster.local:9000"
  S3_BUCKET: "ledger-ae-einvoices"
  S3_REGION: "me-central-1"
  LOG_LEVEL: "INFO"
  ANTHROPIC_MODEL_ID: "claude-3-7-sonnet-20250219"
---
apiVersion: v1
kind: Secret
metadata:
  name: ledger-secrets
  namespace: ledger-ae
  labels:
    app.kubernetes.io/part-of: ledger-ae
type: Opaque
stringData:
  database-url: "postgresql://ledger_admin:LedgerSecure_2026!@ledger-postgres-svc.ledger-ae.svc.cluster.local:5432/ledger_ae"
  backend-database-url: "postgresql+asyncpg://ledger_admin:LedgerSecure_2026!@ledger-postgres-svc.ledger-ae.svc.cluster.local:5432/ledger_ae"
  jwt-secret: "01234567890123456789012345678901"
  totp-encryption-key: "01234567890123456789012345678901"
  nextauth-secret: "production_secret_32_chars_long_2026!"
  anthropic-api-key: "sk-ant-production-placeholder-replace-in-vault"
  s3-access-key: "ledger_minio_admin"
  s3-secret-key: "LedgerMinioSecret_2026!"
  redis-password: "LedgerRedisAuth_2026!"
  postgres-user: "ledger_admin"
  postgres-password: "LedgerSecure_2026!"
  postgres-db: "ledger_ae"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-web-sa
  namespace: ledger-ae
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-backend-sa
  namespace: ledger-ae
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-worker-sa
  namespace: ledger-ae
automountServiceAccountToken: false
---
# ==============================================================================
# Python FastAPI Authoritative Financial Backend
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-backend
  namespace: ledger-ae
  labels:
    app: ledger-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledger-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ledger-backend
    spec:
      serviceAccountName: ledger-backend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: ledger-ae/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: ENVIRONMENT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: backend-database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: jwt-secret
            - name: TOTP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: totp-encryption-key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: anthropic-api-key
            - name: ANTHROPIC_MODEL_ID
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: ANTHROPIC_MODEL_ID
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: redis-password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-backend-svc
  namespace: ledger-ae
  labels:
    app: ledger-backend
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
      protocol: TCP
  selector:
    app: ledger-backend
  type: ClusterIP
---
# ==============================================================================
# Next.js ERP Web Application
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-web
  namespace: ledger-ae
  labels:
    app: ledger-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ledger-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ledger-web
    spec:
      serviceAccountName: ledger-web-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: web
          image: ledger-ae/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: NODE_ENV
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: BACKEND_API_URL
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: BACKEND_API_URL
            - name: NEXT_PUBLIC_APP_URL
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: NEXT_PUBLIC_APP_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: database-url
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: nextauth-secret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: jwt-secret
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: redis-password
            - name: TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: TEMPORAL_ADDRESS
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: S3_ENDPOINT
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: s3-secret-key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /en/login
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /en/login
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-web-svc
  namespace: ledger-ae
  labels:
    app: ledger-web
spec:
  ports:
    - port: 80
      targetPort: 3000
      name: http
      protocol: TCP
  selector:
    app: ledger-web
  type: ClusterIP
---
# ==============================================================================
# Temporal Background Accounting Worker
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-temporal-worker
  namespace: ledger-ae
  labels:
    app: ledger-temporal-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledger-temporal-worker
  template:
    metadata:
      labels:
        app: ledger-temporal-worker
    spec:
      serviceAccountName: ledger-worker-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: worker
          image: ledger-ae/worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: database-url
            - name: TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: TEMPORAL_ADDRESS
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: S3_ENDPOINT
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: s3-secret-key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
---
# ==============================================================================
# Horizontal Pod Autoscaling (HPA)
# ==============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ledger-web-hpa
  namespace: ledger-ae
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ledger-web
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ledger-backend-hpa
  namespace: ledger-ae
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ledger-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
# ==============================================================================
# Production Ingress with TLS & Routing
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ledger-ingress
  namespace: ledger-ae
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
    - hosts:
        - app.ledgeraegroup.ae
        - api.ledgeraegroup.ae
      secretName: ledger-tls-cert
  rules:
    - host: app.ledgeraegroup.ae
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ledger-web-svc
                port:
                  number: 80
    - host: api.ledgeraegroup.ae
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ledger-backend-svc
                port:
                  number: 8000
