apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ledger-ae.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  PORT: {{ .Values.web.service.targetPort | quote }}
  BACKEND_PORT: {{ .Values.backend.service.targetPort | quote }}
  BACKEND_API_URL: "http://ledger-backend-svc:{{ .Values.backend.service.targetPort }}"
  NEXT_PUBLIC_APP_URL: "https://{{ (index .Values.ingress.hosts 0).host }}"
  NEXT_PUBLIC_DEFAULT_LOCALE: {{ .Values.config.defaultLocale | quote }}
  DEFAULT_LOCALE: {{ .Values.config.defaultLocale | quote }}
  DEFAULT_TIMEZONE: {{ .Values.config.timezone | quote }}
  JURISDICTION: {{ .Values.config.jurisdiction | quote }}
  CURRENCY_CODE: {{ .Values.config.currencyCode | quote }}
  CURRENCY_EXPONENT: "2"
  NEXT_TELEMETRY_DISABLED: "1"
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  TEMPORAL_ADDRESS: {{ .Values.config.temporalAddress | quote }}
  S3_ENDPOINT: {{ .Values.config.s3Endpoint | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  S3_REGION: {{ .Values.config.s3Region | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  ANTHROPIC_MODEL_ID: {{ .Values.config.anthropicModelId | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ledger-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ledger-ae.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.databaseUrl | quote }}
  backend-database-url: {{ .Values.secrets.backendDatabaseUrl | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  totp-encryption-key: {{ .Values.secrets.totpEncryptionKey | quote }}
  nextauth-secret: {{ .Values.secrets.nextauthSecret | quote }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
  s3-access-key: {{ .Values.secrets.s3AccessKey | quote }}
  s3-secret-key: {{ .Values.secrets.s3SecretKey | quote }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  postgres-user: {{ .Values.secrets.postgresUser | quote }}
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  postgres-db: {{ .Values.secrets.postgresDb | quote }}
