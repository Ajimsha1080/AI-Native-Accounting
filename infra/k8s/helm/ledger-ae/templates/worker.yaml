{{- if .Values.worker.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-temporal-worker
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ledger-ae.labels" . | nindent 4 }}
    app: ledger-temporal-worker
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: ledger-temporal-worker
  template:
    metadata:
      labels:
        app: ledger-temporal-worker
    spec:
      serviceAccountName: ledger-worker-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: database-url
            - name: TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: TEMPORAL_ADDRESS
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: S3_ENDPOINT
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: s3-secret-key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
{{- end }}
