{{- if .Values.serviceAccounts.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-web-sa
  namespace: {{ .Values.global.namespace }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-backend-sa
  namespace: {{ .Values.global.namespace }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-worker-sa
  namespace: {{ .Values.global.namespace }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-migration-sa
  namespace: {{ .Values.global.namespace }}
automountServiceAccountToken: false
{{- end }}
