{{- if .Values.web.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-web
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ledger-ae.labels" . | nindent 4 }}
    app: ledger-web
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app: ledger-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ledger-web
    spec:
      serviceAccountName: ledger-web-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.web.service.targetPort }}
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: NODE_ENV
            - name: PORT
              value: {{ .Values.web.service.targetPort | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: BACKEND_API_URL
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: BACKEND_API_URL
            - name: NEXT_PUBLIC_APP_URL
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: NEXT_PUBLIC_APP_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: database-url
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: nextauth-secret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: jwt-secret
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: redis-password
            - name: TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: TEMPORAL_ADDRESS
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: S3_ENDPOINT
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: s3-secret-key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /en/login
              port: {{ .Values.web.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /en/login
              port: {{ .Values.web.service.targetPort }}
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-web-svc
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ledger-ae.labels" . | nindent 4 }}
    app: ledger-web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: {{ .Values.web.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: ledger-web
{{- end }}
