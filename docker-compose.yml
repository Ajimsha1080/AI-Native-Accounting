services:
  # ============================================================================
  # Primary Database: PostgreSQL 16 with pgvector & RLS
  # Pinned for UAE Region (e.g. AWS me-central-1)
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ledger-ae-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledger_ae
      POSTGRES_USER: ledger_admin
      POSTGRES_PASSWORD: secret_local_postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/shared-types/src/schema.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_admin -d ledger_ae"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Cache & Distributed Locking: Redis
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: ledger-ae-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Durable Workflow Engine: Temporal Server & UI
  # Orchestrates Month-End Close, Accruals, E-Invoicing Retries, AI Agents
  # ============================================================================
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: ledger-ae-temporal
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=ledger_admin
      - POSTGRES_PWD=secret_local_postgres_password
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: ledger-ae-temporal-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal

  # ============================================================================
  # S3 Compatible Storage: MinIO (Local Simulation for UAE Encrypted Object Store)
  # 10-Year E-Invoicing UBL XML Archives & Receipt Images
  # ============================================================================
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: ledger-ae-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
