services:
  # ============================================================================
  # Primary Database: PostgreSQL 16 with pgvector & RLS
  # Target Region: UAE (AWS me-central-1 equivalent)
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ledger-ae-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledger_ae}
      POSTGRES_USER: ${POSTGRES_USER:-ledger_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-LedgerSecure_2026!}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/shared-types/src/schema.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledger_admin} -d ${POSTGRES_DB:-ledger_ae}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Cache & Distributed Locking: Redis 7.2 Alpine
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: ledger-ae-redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD";
      else
        redis-server;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Durable Workflow Engine: Temporal Server & UI
  # Orchestrates Month-End Close, Accruals, E-Invoicing Retries, AI Agents
  # ============================================================================
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: ledger-ae-temporal
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-ledger_admin}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-LedgerSecure_2026!}
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: ledger-ae-temporal-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      - temporal

  # ============================================================================
  # S3-Compatible Object Storage: MinIO
  # 10-Year E-Invoicing UBL XML Archives & Receipt Documents
  # ============================================================================
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: ledger-ae-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ledger_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-LedgerMinioSecret_2026!}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  # ============================================================================
  # LedgerAE Next.js ERP Web Application
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: ledger-ae-web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ledger_admin}:${POSTGRES_PASSWORD:-LedgerSecure_2026!}@postgres:5432/${POSTGRES_DB:-ledger_ae}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TEMPORAL_ADDRESS: temporal:7233
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ledger_minio_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-LedgerMinioSecret_2026!}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-production_secret_32_chars_long_2026!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # LedgerAE Background Accounting Temporal Worker
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: ledger-ae-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ledger_admin}:${POSTGRES_PASSWORD:-LedgerSecure_2026!}@postgres:5432/${POSTGRES_DB:-ledger_ae}
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  miniodata:
